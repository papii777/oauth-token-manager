name = "oauth-token-manager"
main = "index.js"
compatibility_date = "2024-01-01"

# ─── KV Namespace Bindings ────────────────────────────────────────────────────
# After running `wrangler kv:namespace create "TOKENS"`, replace the
# placeholder id below with the real namespace ID printed by Wrangler.
[[kv_namespaces]]
binding = "TOKENS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# ─── Environment Variables ────────────────────────────────────────────────────
# Sensitive values should be set as secrets via:
#   wrangler secret put CLIENT_ID
#   wrangler secret put CLIENT_SECRET
#   wrangler secret put TENANT_ID
#   wrangler secret put BOT_TOKEN
#   wrangler secret put CHAT_ID
#   wrangler secret put RENDER_API_URL
#   wrangler secret put REDIRECT_URI
#
# Non-secret values can be placed here:
[vars]
# REDIRECT_URI = "https://oauth-token-manager.<your-subdomain>.workers.dev/callback"
